name: blocking-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'

jobs:
  dependency-light-unit-contract:
    name: dependency-light unit and contract evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - name: Install dependency-light test tooling
        run: python -m pip install pytest
      - name: Run dependency-light contracts
        run: python -m pytest -q tests/core/ tests/architecture/test_ami_constitution.py tests/assurance/test_control_catalog.py tests/assurance/test_capability_registry.py
      - name: Write evidence
        run: python scripts/ci/write_evidence.py --job dependency-light-unit-contract --command "pytest dependency-light contracts" --output evidence/dependency-light-unit-contract.json
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-light-unit-contract-evidence
          path: evidence/dependency-light-unit-contract.json
          if-no-files-found: error

  full-integration:
    name: full integration evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/security/test_language_contracts.py tests/architecture/test_inventory.py
      - run: python scripts/ci/write_evidence.py --job full-integration --command "pytest language contracts and inventory" --output evidence/full-integration.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-integration-evidence
          path: evidence/full-integration.json
          if-no-files-found: error

  architecture-fitness:
    name: architecture fitness evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python scripts/architecture_inventory.py --check
      - run: python scripts/ci/workflow_lint.py
      - run: python scripts/ci/write_evidence.py --job architecture-fitness --command "inventory check and workflow lint" --output evidence/architecture-fitness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-fitness-evidence
          path: evidence/architecture-fitness.json
          if-no-files-found: error

  static-typing:
    name: static typing evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python -m compileall -q src
      - run: python scripts/ci/write_evidence.py --job static-typing --command "compileall src" --output evidence/static-typing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-typing-evidence
          path: evidence/static-typing.json
          if-no-files-found: error

  lint-format:
    name: lint and format evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: git diff --check
      - run: python scripts/ci/write_evidence.py --job lint-format --command "git diff --check" --output evidence/lint-format.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lint-format-evidence
          path: evidence/lint-format.json
          if-no-files-found: error

  optimized-python:
    name: optimized Python parity evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/core/
      - run: python -O -m pytest -q tests/core/
      - run: python scripts/ci/write_evidence.py --job optimized-python --command "pytest tests/core under normal and optimized Python" --output evidence/optimized-python.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optimized-python-evidence
          path: evidence/optimized-python.json
          if-no-files-found: error

  research-optional-nonblocking:
    name: optional research checks nonblocking advisory
    runs-on: ubuntu-latest
    continue-on-error: ${{ true }}
    steps:
      - run: echo "Optional research-only job; do not configure as a required branch check."
