name: constitutional-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: constitutional-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  dependency-light-unit-contract:
    name: constitutional unit and contract evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - name: Set up constitutional Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hashed constitutional toolchain
        run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - name: Run dependency-light constitutional contracts
        run: python scripts/ci/run_constitutional_gate.py --check unit
      - name: Write evidence
        run: python scripts/ci/write_evidence.py --job dependency-light-unit-contract --command "dependency-light constitutional contracts" --output evidence/dependency-light-unit-contract.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-light-unit-contract-evidence
          path: evidence/dependency-light-unit-contract.json
          if-no-files-found: error

  full-integration:
    name: authoritative episode constitutional integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - run: python scripts/ci/run_constitutional_gate.py --check integration
      - run: python scripts/ci/write_evidence.py --job full-integration --command "authoritative episode constitutional integration" --output evidence/full-integration.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-integration-evidence
          path: evidence/full-integration.json
          if-no-files-found: error

  architecture-fitness:
    name: architecture and workflow reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - run: python scripts/architecture_inventory.py --check
      - run: python scripts/ci/run_constitutional_gate.py --check workflow
      - run: python scripts/ci/write_evidence.py --job architecture-fitness --command "inventory and workflow reproducibility" --output evidence/architecture-fitness.json

  static-typing:
    name: mypy constitutional assurance surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - run: python scripts/ci/run_constitutional_gate.py --check typing
      - run: python scripts/ci/write_evidence.py --job static-typing --command "mypy scripts/ci" --output evidence/static-typing.json

  lint-format:
    name: Black and isort check mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - run: python scripts/ci/run_constitutional_gate.py --check format
      - run: python scripts/ci/write_evidence.py --job lint-format --command "black and isort check mode" --output evidence/lint-format.json

  optimized-python:
    name: normal and optimized Python security parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements-constitutional.txt
      - run: python scripts/ci/run_constitutional_gate.py --check security
      - run: python scripts/ci/write_evidence.py --job optimized-python --command "security contracts under normal and optimized Python" --output evidence/optimized-python.json
