name: blocking-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: secret scan evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python scripts/ci/secret_scan.py
      - run: python scripts/ci/write_evidence.py --job secret-scan --command "secret pattern policy" --output evidence/secret-scan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secret-scan-evidence
          path: evidence/secret-scan.json
          if-no-files-found: error

  sast:
    name: SAST evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python -m compileall -q src/vulcan/core src/vulcan/assurance src/vulcan/runtime
      - name: Workflow anti-bypass lint
        run: python scripts/ci/workflow_lint.py
      - run: python scripts/ci/write_evidence.py --job sast --command "compileall security surface and workflow lint" --output evidence/sast.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sast-evidence
          path: evidence/sast.json
          if-no-files-found: error

  dependency-vulnerability-policy:
    name: dependency vulnerability policy evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
      - run: python scripts/ci/verify_dependency_inputs.py
      - run: python scripts/ci/write_evidence.py --job dependency-vulnerability-policy --command "verify dependency inputs" --output evidence/dependency-vulnerability-policy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-vulnerability-policy-evidence
          path: evidence/dependency-vulnerability-policy.json
          if-no-files-found: error
