name: blocking-docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image-e2e:
    name: image E2E evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/ci/verify_image_inputs.py
      - run: python scripts/ci/write_evidence.py --job image-e2e --command "verify image inputs" --output evidence/image-e2e.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-e2e-evidence
          path: evidence/image-e2e.json
          if-no-files-found: error

  supply-chain-evidence:
    name: supply-chain evidence
    runs-on: ubuntu-latest
    needs: [image-e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/ci/verify_supply_chain_inputs.py
      - run: python scripts/ci/write_evidence.py --job supply-chain-evidence --command "verify supply-chain inputs" --output evidence/supply-chain-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain-evidence.json
          if-no-files-found: error
